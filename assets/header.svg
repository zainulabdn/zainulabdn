<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#062a4a"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#13B9FD"/>
      <stop offset="0.65" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA"><stop offset="0" stop-color="#13B9FD" stop-opacity=".55"/><stop offset="1" stop-color="#13B9FD" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#02569B" stop-opacity=".6"/><stop offset="1" stop-color="#02569B" stop-opacity="0"/></radialGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#13B9FD"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>

    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .rise { opacity: 0; animation: rise 1s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-10px) } }
      .spin { transform-origin: 1030px 160px; animation: spin 24s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#gridMask)"/>

    <!-- drifting glow orbs -->
    <circle r="260" fill="url(#orbC)"><animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;120;40" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="220" fill="url(#orbA)"><animate attributeName="cx" values="980;860;980" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="260;170;260" dur="11s" repeatCount="indefinite"/></circle>
    <circle r="180" fill="url(#orbB)"><animate attributeName="cx" values="640;760;640" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="330;250;330" dur="16s" repeatCount="indefinite"/></circle>

    <!-- orbit rings + Flutter mark -->
    <g class="spin" opacity=".35">
      <circle cx="1030" cy="160" r="112" stroke="#13B9FD" stroke-width="1" stroke-dasharray="4 10"/>
      <circle cx="1142" cy="160" r="5" fill="#13B9FD"/>
    </g>
    <circle cx="1030" cy="160" r="78" stroke="#8b5cf6" stroke-opacity=".3" stroke-width="1"/>
    <g class="float">
      <g transform="translate(990 108) scale(1.6)">
        <path d="M31.4 0 0 31.4l9.7 9.7L50.8 0z" fill="#54C5F8"/>
        <path d="M31.4 29 14.6 45.8l9.7 9.9 26.5-26.7z" fill="#54C5F8"/>
        <path d="m24.3 55.7 7.1 7.2h19.4L34 45.9z" fill="#01579B"/>
        <path d="m14.6 45.8 9.7-9.7 9.7 9.8-9.7 9.8z" fill="#29B6F6"/>
      </g>
    </g>

    <!-- terminal prompt -->
    <g class="rise d1">
      <text x="80" y="92" class="mono" font-size="17" fill="#13B9FD">~/xayn <tspan fill="#8b949e">$</tspan> <tspan fill="#c9d1d9">flutter run --release</tspan><tspan class="blink" fill="#13B9FD"> ▍</tspan></text>
    </g>

    <!-- name -->
    <g class="rise d2">
      <text x="76" y="170" class="sans" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Zain Ul Abideen</text>
    </g>

    <!-- accent line -->
    <rect class="rise d3" x="80" y="192" width="0" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="width" from="0" to="520" dur="1.2s" begin=".8s" fill="freeze"/>
    </rect>

    <!-- role -->
    <g class="rise d3">
      <text x="80" y="232" class="sans" font-size="22" font-weight="600" fill="#e6edf3">Flutter Engineer <tspan fill="#13B9FD">•</tspan> Mobile Product Builder <tspan fill="#13B9FD">•</tspan> UI Craftsman</text>
    </g>

    <!-- chips -->
    <g class="rise d4 sans" font-size="14" font-weight="600">
      <rect x="80" y="252" width="118" height="30" rx="15" fill="#13B9FD" fill-opacity=".12" stroke="#13B9FD" stroke-opacity=".5"/>
      <text x="139" y="272" text-anchor="middle" fill="#7dd3fc">5+ YEARS</text>
      <rect x="208" y="252" width="140" height="30" rx="15" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".5"/>
      <text x="278" y="272" text-anchor="middle" fill="#c4b5fd">13+ LIVE APPS</text>
      <rect x="358" y="252" width="150" height="30" rx="15" fill="#2ea44f" fill-opacity=".12" stroke="#2ea44f" stroke-opacity=".6"/>
      <circle cx="378" cy="267" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="443" y="272" text-anchor="middle" fill="#7ee787">OPEN TO WORK</text>
    </g>

    <!-- border -->
    <rect x=".5" y=".5" width="1199" height="319" rx="21.5" stroke="#13B9FD" stroke-opacity=".25"/>
  </g>
</svg>
